name: collect

on:
  schedule:
    - cron: '17 21 * * *' # 매일 한국 시간 06:17
  workflow_dispatch:
    inputs:
      resummarize:
        description: '모든 README 요약을 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/collect.py ${{ inputs.resummarize && '--resummarize' || '' }}
      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 일일 갱신 $(date -u +%F)"
            # 수집하는 동안 다른 커밋이 올라왔을 수 있으므로, 최신 main 위로 다시 얹어서 최대 5번 시도한다
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" = 5 ]; then echo "push 실패"; exit 1; fi
              sleep $((i * 3))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
